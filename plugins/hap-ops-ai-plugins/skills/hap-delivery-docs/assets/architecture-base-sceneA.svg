<!-- ========== 底部图例 ========== -->
<text class="ts" x="60" y="1290">链路说明：① 用户 https://hap.domain.com → ② 192.168.1.10（上游网关） → ③ 192.168.1.20（Nginx VIP） → ④ 192.168.1.11/12（Nginx 双节点） → ⑤ K8s www 微服务</text>
