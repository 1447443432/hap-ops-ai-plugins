<svg width="100%" viewBox="0 0 760 1340" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK SC, WenQuanYi Zen Hei, sans-serif">
<!-- 历史基底（用户原始场景A素材）。仅用于参数化重绘的版式/配色参考。
     本文件已采用示例值（192.168.1.x / hap.domain.com）与新端口标准（MinIO 9011-9014）。
     生成新架构图时按 params 参数与 templates/architecture.md 规则重绘端口/层级/节点数。 -->
<title>HAP 集群标准版部署架构（历史基底）</title>
<desc>HAP 私有部署集群标准版场景A：用户 → hap.domain.com → 上游网关 192.168.1.10 → Nginx VIP 192.168.1.20 → Nginx 双节点 → K8s 微服务 www → 数据库 / 缓存 / 中间件层。</desc>
<defs>
<style>
  .t    { font-size: 14px; font-weight: 400; fill: #1f1f1f; }
  .ts   { font-size: 12px; font-weight: 400; fill: #4a4a4a; }
  .th   { font-size: 14px; font-weight: 500; fill: #1f1f1f; }
  .arr  { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
  .c-gray   rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray   .th, .c-gray > text.th { fill: #2C2C2A; }
  .c-gray   .ts, .c-gray > text.ts { fill: #444441; }
  .c-blue   rect { fill: #E6F1FB; stroke: #185FA5; }
  .c-blue   .th, .c-blue > text.th { fill: #0C447C; }
  .c-blue   .ts, .c-blue > text.ts { fill: #185FA5; }
  .c-teal   rect { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal   .th, .c-teal > text.th { fill: #085041; }
  .c-teal   .ts, .c-teal > text.ts { fill: #0F6E56; }
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple .th, .c-purple > text.th { fill: #3C3489; }
  .c-purple .ts, .c-purple > text.ts { fill: #534AB7; }
  .c-coral  rect { fill: #FAECE7; stroke: #993C1D; }
  .c-coral  .th, .c-coral > text.th { fill: #712B13; }
  .c-coral  .ts, .c-coral > text.ts { fill: #993C1D; }
  .c-amber  rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber  .th, .c-amber > text.th { fill: #633806; }
  .c-amber  .ts, .c-amber > text.ts { fill: #854F0B; }
  .c-rose   rect { fill: #FBE7EE; stroke: #A11D58; }
  .c-rose   .th, .c-rose > text.th { fill: #791541; }
  .c-rose   .ts, .c-rose > text.ts { fill: #A11D58; }
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="760" height="1340" fill="#ffffff"/>

<!-- 标题 -->
<text class="th" x="380" y="26" text-anchor="middle" font-size="16" font-weight="600">HAP 集群标准版部署架构</text>
<text class="ts" x="380" y="46" text-anchor="middle">场景 A · 未开启 Docker Swarm 集群</text>

<!-- 外部用户 -->
<g class="c-gray">
<rect x="280" y="64" width="200" height="46" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="82" text-anchor="middle" dominant-baseline="central">外部用户 / 终端</text>
<text class="ts" x="380" y="98" text-anchor="middle" dominant-baseline="central">浏览器 / 移动端</text>
</g>

<line x1="380" y1="110" x2="380" y2="138" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="390" y="128" text-anchor="start">https://hap.domain.com</text>

<!-- 上游网关 / LB -->
<g class="c-blue">
<rect x="220" y="140" width="320" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="158" text-anchor="middle" dominant-baseline="central">上游 LB / 网关 · 192.168.1.10</text>
<text class="ts" x="380" y="176" text-anchor="middle" dominant-baseline="central">监听 80 / 443（HTTPS 接入终止）</text>
</g>

<line x1="380" y1="190" x2="380" y2="218" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="390" y="208" text-anchor="start">转发 HTTP · 80</text>

<!-- Nginx VIP -->
<g class="c-rose">
<rect x="220" y="220" width="320" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="238" text-anchor="middle" dominant-baseline="central">Nginx VIP · 192.168.1.20</text>
<text class="ts" x="380" y="256" text-anchor="middle" dominant-baseline="central">Keepalived 漂移 · VRRP VI_1 · 监听 80</text>
</g>

<line x1="380" y1="270" x2="380" y2="298" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="390" y="288" text-anchor="start">代理转发 · upstream</text>

<!-- Nginx 双节点 -->
<g class="c-coral">
<rect x="120" y="300" width="520" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="380" y="320" text-anchor="middle" dominant-baseline="central">Nginx 反向代理 · 双节点高可用</text>
<text class="ts" x="240" y="346" text-anchor="middle" dominant-baseline="central">Nginx 01 · 192.168.1.11</text>
<text class="ts" x="240" y="360" text-anchor="middle" dominant-baseline="central">MASTER · priority 110</text>
<text class="ts" x="520" y="346" text-anchor="middle" dominant-baseline="central">Nginx 02 · 192.168.1.12</text>
<text class="ts" x="520" y="360" text-anchor="middle" dominant-baseline="central">BACKUP · priority 100</text>
</g>

<line x1="380" y1="370" x2="380" y2="398" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="390" y="388" text-anchor="start">转发到后端微服务 · www</text>

<!-- K8s 集群整体框 -->
<g class="c-blue">
<rect x="40" y="400" width="680" height="220" rx="14" stroke-width="0.5"/>
<text class="th" x="60" y="422">Kubernetes 三 Master 集群（微服务层 + Flink 计算层）</text>
<text class="ts" x="60" y="438">K8s Master+Worker 01 / 02 / 03 · 192.168.1.21 / 22 / 23 · 16C / 64G · containerd</text>
</g>

<!-- 微服务命名空间 -->
<g class="c-teal">
<rect x="60" y="456" width="320" height="148" rx="10" stroke-width="0.5"/>
<text class="th" x="220" y="478" text-anchor="middle">namespace: default</text>
<text class="ts" x="220" y="498" text-anchor="middle">微服务层</text>
<text class="ts" x="220" y="520" text-anchor="middle">www（NodePort / Service）</text>
<text class="ts" x="220" y="540" text-anchor="middle">业务 / API 服务（多副本）</text>
<text class="ts" x="220" y="564" text-anchor="middle">ConfigMap 注入 HAP 主地址：</text>
<text class="ts" x="220" y="582" text-anchor="middle" font-style="italic">https://hap.domain.com · 443</text>
</g>

<!-- Flink 命名空间 -->
<g class="c-purple">
<rect x="400" y="456" width="320" height="148" rx="10" stroke-width="0.5"/>
<text class="th" x="560" y="478" text-anchor="middle">namespace: flink</text>
<text class="ts" x="560" y="498" text-anchor="middle">JobManager · TaskManager</text>
<text class="ts" x="560" y="520" text-anchor="middle">JobManager UI · 28081</text>
<text class="ts" x="560" y="540" text-anchor="middle">实时聚合表 / 数据集成</text>
<text class="ts" x="560" y="564" text-anchor="middle">s3 endpoint：</text>
<text class="ts" x="560" y="582" text-anchor="middle" font-style="italic">192.168.1.51:9011（MinIO API）</text>
</g>

<!-- 微服务读写：箭头向下 -->
<line x1="220" y1="620" x2="220" y2="650" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="232" y="640" text-anchor="start">DB / Cache / MQ / 存储</text>

<!-- Flink 数据流：从中间件回到 Flink -->
<path d="M 480 650 L 480 632 L 480 604" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="472" y="640" text-anchor="end" style="fill:#534AB7">① 消费 Kafka</text>

<path d="M 620 604 L 620 632 L 620 650" fill="none" stroke="#534AB7" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="628" y="640" text-anchor="start" style="fill:#534AB7">② 写入 MinIO</text>

